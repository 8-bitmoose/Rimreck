{% extends 'base.html' %}
{% block content %}
<h1 class="h4">Login</h1>
<form method="post" class="card card-body" style="max-width:420px">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Sign in</button>
</form>
<p class="mt-3"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
{% endblock %}
