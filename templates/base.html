{% load static %}
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rimreck</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" href="/">Rimreck</a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <span class="badge text-bg-secondary">{{ rimreck_mode }}</span>
      {% if user.is_authenticated %}
      <span class="small text-muted">{{ user.username }}</span>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'logout' %}">Logout</a>
      {% else %}
      <a class="btn btn-sm btn-primary" href="{% url 'login' %}">Login</a>
      {% endif %}
      <button id="theme-toggle" class="btn btn-sm btn-outline-dark" type="button">Theme</button>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="border-top py-3">
  <div class="container small text-muted">Rimreck • AGPL-3.0</div>
</footer>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
